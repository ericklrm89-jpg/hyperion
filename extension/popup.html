<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; padding: 12px; font-family: system-ui, sans-serif; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    .status { padding: 8px; border-radius: 4px; margin-bottom: 8px; }
    .connected { background: #d4edda; color: #155724; }
    .disconnected { background: #f8d7da; color: #721c24; }
    .info { font-size: 12px; color: #666; }
    button { width: 100%; padding: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Hyperion Browser</h1>
  <div id="status" class="status disconnected">Disconnected</div>
  <div id="info" class="info">
    <div>Tabs: <span id="tabCount">0</span></div>
    <div>Mode: Extension + Native Messaging</div>
  </div>
  <button id="reconnect">Reconnect</button>

  <script src="popup.js"></script>
</body>
</html>
