name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

jobs:
  build-lint-test:
    name: Build, Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Guard against scripts/ sprawl
        run: |
          SCRIPTS_COUNT=$(find scripts -maxdepth 2 -type f 2>/dev/null | wc -l)
          echo "Current scripts count: $SCRIPTS_COUNT"
          if [ "$SCRIPTS_COUNT" -gt 5 ]; then
            echo "ERROR: Too many loose scripts in scripts/ ($SCRIPTS_COUNT > 5). Consolidate logic into src/ as ActionRegistry actions or move to archive/."
            exit 1
          fi

      - name: Build TypeScript
        run: npm run build

      - name: Run Linter
        run: npm run lint

      - name: Guard against unverified actions (Anti-Self-Deception)
        run: node scripts/ci/guard-verified-actions.js

      - name: Run Tests
        run: npm run test

